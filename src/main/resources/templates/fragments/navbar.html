<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="global-styles">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        @import url('https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css');

        :root {
            --sb-primary: #2563EB;
            --sb-primary-hover: #1D4ED8;
            --sb-accent: #10B981;
            --sb-bg: #F8FAFC;
            --sb-surface: #FFFFFF;
            --sb-text: #1E293B;
            --sb-text-muted: #64748B;
            --sb-border: #E2E8F0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--sb-bg);
            color: var(--sb-text);
        }

        .sb-navbar {
            background-color: var(--sb-surface);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 0.75rem 0;
        }

        .sb-brand {
            font-weight: 700;
            color: var(--sb-primary) !important;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sb-nav-link {
            font-weight: 500;
            color: var(--sb-text-muted) !important;
            transition: color 0.2s ease;
            padding: 0.5rem 1rem !important;
        }

        .sb-nav-link:hover, .sb-nav-link.active {
            color: var(--sb-primary) !important;
        }
        
        .sb-card {
            background: var(--sb-surface);
            border: 1px solid var(--sb-border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-sb-primary {
            background-color: var(--sb-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: all 0.2s;
        }
        
        .btn-sb-primary:hover {
            background-color: var(--sb-primary-hover);
            color: white;
            transform: translateY(-1px);
        }
        
        .btn-sb-accent {
            background-color: var(--sb-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            padding: 0.5rem 1rem;
            transition: all 0.2s;
        }
        
        .btn-sb-accent:hover {
            background-color: #059669;
            color: white;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg sb-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand sb-brand" th:href="@{/profile}">
                <i class="bi bi-layers-half"></i> SkillBridge
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="bi bi-list fs-1 text-dark"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item">
                        <a class="nav-link sb-nav-link" th:href="@{/profile}"><i class="bi bi-person-badge me-1"></i>Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link sb-nav-link" th:href="@{/profile/skills}"><i class="bi bi-tools me-1"></i>My Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link sb-nav-link" th:href="@{/matches}"><i class="bi bi-search me-1"></i>Find Matches</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link sb-nav-link dropdown-toggle" href="#" id="requestsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-arrow-left-right me-1"></i>Requests
                        </a>
                        <ul class="dropdown-menu border-0 shadow-sm rounded-3" aria-labelledby="requestsDropdown">
                            <li><a class="dropdown-item py-2" th:href="@{/requests/incoming}"><i class="bi bi-box-arrow-in-down me-2 text-primary"></i>Incoming Requests</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/requests/outgoing}"><i class="bi bi-box-arrow-up me-2 text-secondary"></i>Outgoing Requests</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <a class="nav-link position-relative dropdown-toggle p-2 rounded-circle bg-light" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: var(--sb-text-muted);">
                            <i class="bi bi-bell fs-5"></i>
                            <span th:if="${unreadNotificationCount > 0}" 
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-white"
                                  th:text="${unreadNotificationCount}">
                                1
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg rounded-4 mt-2" aria-labelledby="notificationDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                            <li><h6 class="dropdown-header d-flex justify-content-between align-items-center py-3 bg-light rounded-top-4 border-bottom">
                                <span class="fw-bold text-dark mb-0">Notifications</span>
                                <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-link btn-sm p-0 text-decoration-none fw-medium">Mark all read</button>
                                </form>
                            </h6></li>
                            
                            <li th:if="${#lists.isEmpty(latestNotifications)}">
                                <span class="dropdown-item text-muted text-center py-4">No new notifications</span>
                            </li>
                            
                            <th:block th:each="notif : ${latestNotifications}">
                                <li>
                                    <a class="dropdown-item d-flex flex-column py-3 border-bottom" th:href="@{/notifications}" th:classappend="${!notif.read ? 'bg-primary bg-opacity-10' : ''}">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <span class="badge bg-secondary bg-opacity-25 text-dark rounded-pill px-2" style="font-size: 0.7rem;" th:text="${notif.type.name()}">TYPE</span>
                                            <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'dd MMM HH:mm')}">Date</small>
                                        </div>
                                        <span class="text-wrap fw-medium text-dark" style="font-size: 0.9rem;" th:text="${notif.message}">Message</span>
                                    </a>
                                </li>
                            </th:block>
                            
                            <li><a class="dropdown-item text-center text-primary fw-medium py-3 rounded-bottom-4" th:href="@{/notifications}">View All Notifications</a></li>
                        </ul>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-sb-primary btn-sm px-4 py-2 rounded-pill shadow-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
