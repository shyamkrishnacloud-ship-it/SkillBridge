<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navbar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/profile}">SkillBridge</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile}">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/profile/skills}">My Skills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/matches}">Find Matches</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="requestsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            My Requests
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="requestsDropdown">
                            <li><a class="dropdown-item" th:href="@{/requests/incoming}">Incoming Requests</a></li>
                            <li><a class="dropdown-item" th:href="@{/requests/outgoing}">Outgoing Requests</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center mt-2 mt-lg-0 gap-3">
                    <div class="dropdown">
                        <a class="nav-link text-white position-relative dropdown-toggle" href="#" id="notificationDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-bell-fill">🔔</i>
                            <span th:if="${unreadNotificationCount > 0}" 
                                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                                  th:text="${unreadNotificationCount}">
                                1
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="notificationDropdown" style="width: 300px; max-height: 400px; overflow-y: auto;">
                            <li><h6 class="dropdown-header d-flex justify-content-between align-items-center">
                                <span>Notifications</span>
                                <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-link btn-sm p-0 text-decoration-none">Mark all read</button>
                                </form>
                            </h6></li>
                            <li><hr class="dropdown-divider"></li>
                            
                            <li th:if="${#lists.isEmpty(latestNotifications)}">
                                <span class="dropdown-item text-muted text-center py-3">No notifications yet.</span>
                            </li>
                            
                            <th:block th:each="notif : ${latestNotifications}">
                                <li>
                                    <a class="dropdown-item d-flex flex-column py-2" th:href="@{/notifications}" th:classappend="${!notif.read ? 'bg-light fw-bold' : ''}">
                                        <small class="text-muted mb-1" th:text="${#temporals.format(notif.createdAt, 'dd MMM HH:mm')}">Date</small>
                                        <span class="text-wrap" th:text="${notif.message}">Message</span>
                                    </a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                            </th:block>
                            
                            <li><a class="dropdown-item text-center text-primary" th:href="@{/notifications}">View All</a></li>
                        </ul>
                    </div>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm px-3">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
