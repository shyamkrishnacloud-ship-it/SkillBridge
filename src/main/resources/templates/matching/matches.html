<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Matches - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .filter-section { background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .match-card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: 100%; transition: transform 0.2s; }
        .match-card:hover { transform: translateY(-5px); }
        .match-score { font-size: 1.5rem; font-weight: bold; color: #198754; }
        .skill-badge { margin-right: 5px; margin-bottom: 5px; }
        .card-title { color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 mb-5">
    <h2 class="mb-4">Find Skill Exchange Partners</h2>

    <!-- Filters Section -->
    <div class="filter-section">
        <form th:action="@{/matches}" method="get" class="row g-3">
            <div class="col-md-3">
                <label for="skill" class="form-label">Search Skill</label>
                <input type="text" class="form-control" id="skill" name="skill" th:value="${paramSkill}" placeholder="e.g. Java, Design">
            </div>
            
            <div class="col-md-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category">
                    <option value="">Any Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == paramCategory}"></option>
                </select>
            </div>
            
            <div class="col-md-2">
                <label for="department" class="form-label">Department</label>
                <input type="text" class="form-control" id="department" name="department" th:value="${paramDepartment}" placeholder="e.g. Computer Science">
            </div>

            <div class="col-md-2">
                <label for="availability" class="form-label">Availability</label>
                <select class="form-select" id="availability" name="availability">
                    <option value="">Any Availability</option>
                    <option th:each="avail : ${availabilities}" th:value="${avail}" th:text="${avail}" th:selected="${avail == paramAvailability}"></option>
                </select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100 me-2">Filter</button>
                <a th:href="@{/matches}" class="btn btn-outline-secondary">Clear</a>
            </div>
        </form>
    </div>

    <!-- Results Section -->
    <div th:if="${#lists.isEmpty(matches)}" class="alert alert-info text-center" role="alert">
        <h5>No matching students found.</h5>
        <p class="mb-0">Try adjusting your filters or search terms.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${not #lists.isEmpty(matches)}">
        <div class="col" th:each="match : ${matches}">
            <div class="card match-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h4 class="card-title mb-1" th:text="${match.username}">Username</h4>
                            <div class="text-muted small">
                                <span th:if="${match.department != null}" th:text="${match.department}">Dept</span>
                                <span th:if="${match.semester != null}" th:text="' | Semester ' + ${match.semester}">Sem</span>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="match-score" th:text="${match.matchScore + '%'}">0%</div>
                            <span class="badge bg-warning text-dark">
                                ★ <span th:text="${#numbers.formatDecimal(match.averageRating, 1, 1)}">0.0</span>
                            </span>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="mb-2 text-muted">Can Teach:</h6>
                        <div th:if="${#lists.isEmpty(match.offeredSkills)}" class="small text-muted fst-italic">None listed</div>
                        <span th:each="skill : ${match.offeredSkills}" class="badge bg-primary skill-badge" th:text="${skill}">Skill</span>
                    </div>
                    
                    <div class="mb-4">
                        <h6 class="mb-2 text-muted">Wants to Learn:</h6>
                        <div th:if="${#lists.isEmpty(match.requiredSkills)}" class="small text-muted fst-italic">None listed</div>
                        <span th:each="skill : ${match.requiredSkills}" class="badge bg-info text-dark skill-badge" th:text="${skill}">Skill</span>
                    </div>
                    
                    <div class="d-grid gap-2 mt-auto">
                        <a th:href="@{'/profile/' + ${match.username}}" class="btn btn-outline-primary">View Profile</a>
                        <a th:href="@{'/requests/send/' + ${match.username}}" class="btn btn-success">Send Swap Request</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
