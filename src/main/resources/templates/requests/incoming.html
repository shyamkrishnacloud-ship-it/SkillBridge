<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Requests - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .request-header {
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background-color: rgba(0,0,0,0.015);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mt-md-5 mb-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary">
                <i class="bi bi-inbox-fill fs-3"></i>
            </div>
            <div>
                <h2 class="mb-0 fw-bold text-dark">Swap Requests</h2>
                <p class="text-muted mb-0">Manage your skill exchange connections</p>
            </div>
        </div>
        <div class="d-flex bg-light p-1 rounded-pill border">
            <a th:href="@{/requests/incoming}" class="btn btn-sb-primary rounded-pill px-4 fw-medium flex-grow-1">Incoming</a>
            <a th:href="@{/requests/outgoing}" class="btn btn-light rounded-pill px-4 fw-medium text-muted flex-grow-1 border-0 bg-transparent">Outgoing</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h5 class="mb-4 fw-bold text-dark"><i class="bi bi-box-arrow-in-down me-2 text-primary"></i>Incoming Requests</h5>
    
    <div th:if="${#lists.isEmpty(requests)}" class="sb-card text-center py-5 border-0">
        <div class="card-body py-4">
            <div class="text-muted mb-3"><i class="bi bi-envelope-open" style="font-size: 3rem;"></i></div>
            <h5 class="fw-bold mb-2">No incoming requests</h5>
            <p class="text-muted mb-4">You don't have any incoming swap requests yet.</p>
            <a th:href="@{/matches}" class="btn btn-sb-primary px-4 py-2 rounded-pill shadow-sm">Find Partners</a>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-lg-2 g-4 mt-2">
        <div class="col" th:each="req : ${requests}">
            <div class="sb-card h-100 border">
                <div class="card-header request-header px-4 py-3 d-flex justify-content-between align-items-center">
                    <span class="badge rounded-pill px-3 py-2 fw-medium"
                          th:classappend="${req.status.name() == 'PENDING' ? 'bg-warning bg-opacity-10 text-warning-emphasis border border-warning-subtle' : 
                                          (req.status.name() == 'ACCEPTED' ? 'bg-info bg-opacity-10 text-info-emphasis border border-info-subtle' : 
                                          (req.status.name() == 'COMPLETED' ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : 'bg-danger bg-opacity-10 text-danger border border-danger-subtle'))}">
                        <i class="bi me-1" th:classappend="${req.status.name() == 'PENDING' ? 'bi-hourglass-split' : (req.status.name() == 'ACCEPTED' ? 'bi-check-circle' : (req.status.name() == 'COMPLETED' ? 'bi-trophy' : 'bi-x-circle'))}"></i>
                        <span th:text="${req.status}">STATUS</span>
                    </span>
                    <small class="text-muted fw-medium"><i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(req.createdDate, 'dd MMM yyyy')}">Date</span></small>
                </div>
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center text-primary fw-bold fs-5 border" style="width: 48px; height: 48px;">
                            <span th:text="${#strings.substring(req.senderUsername,0,1).toUpperCase()}">U</span>
                        </div>
                        <div>
                            <h6 class="text-muted small mb-0 fw-semibold text-uppercase letter-spacing-1">From</h6>
                            <h5 class="card-title mb-0 fw-bold">
                                <a th:href="@{/profile/{username}(username=${req.senderUsername})}" class="text-decoration-none text-dark stretched-link-hover" th:text="${req.senderUsername}">User</a>
                            </h5>
                        </div>
                    </div>
                    
                    <div class="bg-light p-3 rounded-3 border mb-3">
                        <div class="d-flex align-items-start mb-2">
                            <i class="bi bi-arrow-right-circle-fill text-success mt-1 me-2"></i>
                            <div>
                                <small class="text-muted fw-semibold d-block">They offer to teach you:</small>
                                <span class="fw-medium text-dark" th:text="${req.offeredSkillName}">Skill</span>
                            </div>
                        </div>
                        <div class="d-flex align-items-start">
                            <i class="bi bi-arrow-left-circle-fill text-warning mt-1 me-2"></i>
                            <div>
                                <small class="text-muted fw-semibold d-block">They want to learn:</small>
                                <span class="fw-medium text-dark" th:text="${req.requestedSkillName}">Skill</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4 flex-grow-1" th:if="${req.message != null and !req.message.isEmpty()}">
                        <small class="text-muted fw-semibold d-block mb-1 text-uppercase letter-spacing-1" style="font-size: 0.75rem;">Message</small>
                        <div class="p-3 bg-white border rounded-3 text-dark fst-italic position-relative">
                            <i class="bi bi-quote position-absolute text-light" style="font-size: 3rem; top: -10px; left: 5px; z-index: 0;"></i>
                            <span class="position-relative z-1" th:text="${req.message}"></span>
                        </div>
                    </div>
                    
                    <div class="mt-auto pt-3 border-top d-flex flex-column gap-2">
                        <div class="d-flex gap-2" th:if="${req.status.name() == 'PENDING'}">
                            <form th:action="@{/requests/{id}/accept(id=${req.id})}" method="post" class="flex-grow-1">
                                <button type="submit" class="btn btn-sb-accent w-100 rounded-pill shadow-sm"><i class="bi bi-check-lg me-1"></i> Accept</button>
                            </form>
                            <form th:action="@{/requests/{id}/reject(id=${req.id})}" method="post" class="flex-grow-1">
                                <button type="submit" class="btn btn-light border text-danger fw-medium w-100 rounded-pill transition-hover"><i class="bi bi-x-lg me-1"></i> Reject</button>
                            </form>
                        </div>
                        
                        <form th:if="${req.status.name() == 'ACCEPTED'}" th:action="@{/requests/{id}/complete(id=${req.id})}" method="post">
                            <input type="hidden" name="source" value="incoming">
                            <button type="submit" class="btn btn-sb-primary w-100 rounded-pill shadow-sm"><i class="bi bi-flag-fill me-1"></i> Mark as Completed</button>
                        </form>
                        
                        <a th:if="${req.status.name() == 'ACCEPTED' or req.status.name() == 'COMPLETED'}" 
                           th:href="@{/profile/partner/{username}(username=${req.senderUsername})}" 
                           class="btn btn-light border fw-medium text-primary w-100 rounded-pill transition-hover"><i class="bi bi-person-badge me-1"></i> View Partner Details</a>
                        
                        <a th:if="${req.status.name() == 'COMPLETED' and !req.hasReviewed}" th:href="@{/reviews/new/{id}(id=${req.id})}" class="btn btn-warning w-100 rounded-pill fw-medium shadow-sm"><i class="bi bi-star-fill me-1"></i> Leave Review</a>
                        <button th:if="${req.status.name() == 'COMPLETED' and req.hasReviewed}" class="btn btn-light border text-success fw-medium w-100 rounded-pill" disabled><i class="bi bi-check2-all me-1"></i> Review Submitted</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
