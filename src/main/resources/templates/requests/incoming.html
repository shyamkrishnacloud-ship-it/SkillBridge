<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incoming Requests - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Swap Requests</h2>
        <div>
            <a th:href="@{/requests/incoming}" class="btn btn-primary me-2">Incoming</a>
            <a th:href="@{/requests/outgoing}" class="btn btn-outline-primary">Outgoing</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <h4>Incoming Requests</h4>
    
    <div th:if="${#lists.isEmpty(requests)}" class="alert alert-info">
        You don't have any incoming swap requests yet.
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-4 mt-2">
        <div class="col" th:each="req : ${requests}">
            <div class="card h-100 border-primary">
                <div class="card-header bg-primary text-white d-flex justify-content-between">
                    <span class="fw-bold" th:text="${req.status}">STATUS</span>
                    <small th:text="${#temporals.format(req.createdDate, 'dd MMM yyyy')}">Date</small>
                </div>
                <div class="card-body">
                    <h5 class="card-title">
                        From: <a th:href="@{/profile/{username}(username=${req.senderUsername})}" class="text-decoration-none" th:text="${req.senderUsername}">User</a>
                    </h5>
                    
                    <div class="mt-3">
                        <p class="mb-1"><strong>They offer to teach you:</strong> <span th:text="${req.offeredSkillName}">Skill</span></p>
                        <p class="mb-1"><strong>They want to learn:</strong> <span th:text="${req.requestedSkillName}">Skill</span></p>
                    </div>

                    <div class="mt-3 bg-light p-2 border rounded" th:if="${req.message != null and !req.message.isEmpty()}">
                        <small class="text-muted d-block mb-1">Message:</small>
                        <span th:text="${req.message}"></span>
                    </div>
                </div>
                <div class="card-footer bg-white border-top-0 d-flex gap-2 pb-3">
                    <form th:if="${req.status.name() == 'PENDING'}" th:action="@{/requests/{id}/accept(id=${req.id})}" method="post" class="flex-grow-1">
                        <button type="submit" class="btn btn-success w-100">Accept</button>
                    </form>
                    <form th:if="${req.status.name() == 'PENDING'}" th:action="@{/requests/{id}/reject(id=${req.id})}" method="post" class="flex-grow-1">
                        <button type="submit" class="btn btn-danger w-100">Reject</button>
                    </form>
                    
                    <form th:if="${req.status.name() == 'ACCEPTED'}" th:action="@{/requests/{id}/complete(id=${req.id})}" method="post" class="w-100">
                        <input type="hidden" name="source" value="incoming">
                        <button type="submit" class="btn btn-info text-white w-100">Mark as Completed</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
