<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Details - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .profile-card {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: white;
            padding: 30px;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0d6efd;
        }
        .info-label {
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .info-value {
            font-size: 1.1rem;
            color: #212529;
            margin-bottom: 1.5rem;
        }
        .contact-badge {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="profile-card">
                <div class="text-center mb-4">
                    <img th:if="${partner.existingProfilePicturePath != null}" th:src="@{${partner.existingProfilePicturePath}}" alt="Profile Picture" class="profile-img shadow-sm">
                    <img th:if="${partner.existingProfilePicturePath == null}" src="https://ui-avatars.com/api/?name=User&amp;background=random" alt="Default Profile Picture" class="profile-img shadow-sm">

                    <h2 class="mt-3 mb-1" th:text="${partner.username}">Username</h2>
                    <p class="text-muted mb-2" th:text="${(partner.department != null ? partner.department : 'No Department')}">Department</p>
                    <span class="contact-badge">&#128274; Contact Details</span>
                </div>

                <hr class="mb-4">

                <div class="alert alert-info border-0 mb-4" role="alert">
                    <small>These details are only visible to you because you have an accepted or completed skill swap with <strong th:text="${partner.username}">this user</strong>.</small>
                </div>

                <div class="row">
                    <div class="col-sm-6">
                        <div class="info-label">Email Address</div>
                        <div class="info-value">
                            <a th:href="'mailto:' + ${partner.email}" class="text-decoration-none" th:text="${partner.email}">Email</a>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Phone Number</div>
                        <div class="info-value" th:text="${partner.phoneNumber != null and !partner.phoneNumber.isEmpty() ? '+91 ' + partner.phoneNumber : 'Not provided'}">Phone</div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Preferred Time</div>
                        <div class="info-value" th:text="${partner.preferredTime}">Time</div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Availability</div>
                        <div class="info-value">
                            <span class="badge" th:classappend="${partner.availabilityMode != null and partner.availabilityMode.name() == 'ONLINE' ? 'bg-success' : (partner.availabilityMode != null and partner.availabilityMode.name() == 'HYBRID' ? 'bg-info' : 'bg-secondary')}" th:text="${partner.availabilityMode}">Mode</span>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4 d-flex gap-2 justify-content-center">
                    <a th:href="@{/profile/{username}(username=${partner.username})}" class="btn btn-outline-primary">View Public Profile</a>
                    <a th:href="@{/requests/incoming}" class="btn btn-secondary">Back to Requests</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
