<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Details - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .profile-container { max-width: 700px; margin-top: 30px; }
        .hero-banner {
            height: 120px;
            background: linear-gradient(135deg, var(--sb-primary), #3B82F6);
            border-radius: 12px 12px 0 0;
            position: relative;
        }
        .profile-img { 
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 5px solid var(--sb-surface); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-top: -60px; 
            background-color: white; 
            position: relative;
            z-index: 10;
        }
        .info-label {
            font-weight: 600;
            color: var(--sb-text-muted);
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            letter-spacing: 0.5px;
        }
        .info-value {
            font-size: 1.05rem;
            color: var(--sb-text);
            font-weight: 500;
        }
        .contact-badge {
            background: var(--sb-primary);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container profile-container mb-5">
    <div class="sb-card mt-4">
        <div class="hero-banner"></div>
        <div class="card-body text-center pt-0 px-4 pb-5">
            <img th:if="${partner.existingProfilePicturePath != null}" th:src="@{${partner.existingProfilePicturePath}}" alt="Profile Picture" class="profile-img mb-3">
            <img th:if="${partner.existingProfilePicturePath == null}" src="https://ui-avatars.com/api/?name=User&amp;background=random" alt="Default Profile Picture" class="profile-img mb-3">

            <h3 class="fw-bold mb-1" th:text="${partner.username}">Username</h3>
            <p class="text-muted fw-medium mb-3" th:text="${(partner.department != null ? partner.department : 'No Department')}">Department</p>
            <div class="mb-4">
                <span class="contact-badge"><i class="bi bi-person-lines-fill"></i> Private Contact Details</span>
            </div>

            <div class="alert alert-primary bg-primary bg-opacity-10 border-0 border-start border-primary border-4 text-start rounded-end-3 mb-4 d-flex align-items-center gap-3" role="alert">
                <i class="bi bi-info-circle-fill text-primary fs-4"></i>
                <small class="text-dark fw-medium">These details are only visible to you because you have an accepted or completed skill swap with <strong th:text="${partner.username}">this user</strong>.</small>
            </div>

            <div class="sb-card bg-light border-0 p-4 text-start">
                <div class="row g-4">
                    <div class="col-sm-6">
                        <div class="info-label">Email Address</div>
                        <div class="info-value">
                            <a th:href="'mailto:' + ${partner.email}" class="text-decoration-none text-primary" th:text="${partner.email}">Email</a>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Phone Number</div>
                        <div class="info-value" th:text="${partner.phoneNumber != null and !partner.phoneNumber.isEmpty() ? '+91 ' + partner.phoneNumber : 'Not provided'}">Phone</div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Preferred Time</div>
                        <div class="info-value">
                            <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle px-2 py-1" th:text="${partner.preferredTime}">Time</span>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="info-label">Availability</div>
                        <div class="info-value">
                            <span class="badge px-2 py-1" th:classappend="${partner.availabilityMode != null and partner.availabilityMode.name() == 'ONLINE' ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : (partner.availabilityMode != null and partner.availabilityMode.name() == 'HYBRID' ? 'bg-info bg-opacity-10 text-info-emphasis border border-info-subtle' : 'bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle')}" th:text="${partner.availabilityMode}">Mode</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-5 d-flex gap-3 justify-content-center">
                <a th:href="@{/profile/{username}(username=${partner.username})}" class="btn btn-outline-primary fw-medium rounded-pill px-4"><i class="bi bi-person-badge me-2"></i>View Public Profile</a>
                <a th:href="@{/requests/incoming}" class="btn btn-light border fw-medium rounded-pill px-4"><i class="bi bi-arrow-left me-2"></i>Back to Requests</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
