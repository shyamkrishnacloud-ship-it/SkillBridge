<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .profile-container { max-width: 850px; margin-top: 30px; }
        .hero-banner {
            height: 140px;
            background: linear-gradient(135deg, var(--sb-primary), #3B82F6);
            border-radius: 12px 12px 0 0;
            position: relative;
        }
        .profile-img { 
            width: 140px; 
            height: 140px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 5px solid var(--sb-surface); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-top: -70px; 
            background-color: white; 
            position: relative;
            z-index: 10;
        }
        .stat-box {
            background-color: var(--sb-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid var(--sb-border);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sb-text);
        }
        .stat-label {
            font-size: 0.9rem;
            color: var(--sb-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container profile-container mb-5">
    
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mt-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="sb-card mt-4 mb-4">
        <div class="hero-banner"></div>
        <div class="card-body text-center pt-0 px-4 pb-5">
            <img th:if="${profile.existingProfilePicturePath != null}" th:src="@{${profile.existingProfilePicturePath}}" alt="Profile Picture" class="profile-img mb-3">
            <img th:unless="${profile.existingProfilePicturePath != null}" src="https://ui-avatars.com/api/?name=User&background=random" alt="Default Avatar" class="profile-img mb-3">
            
            <h3 class="fw-bold mb-1" th:text="${profile.username}">Username</h3>
            <p class="text-muted mb-4 fs-5" th:text="${profile.email}">email@example.com</p>
            
            <div class="row text-start justify-content-center mb-4">
                <div class="col-md-10">
                    <div class="sb-card bg-light border-0 p-4 p-md-5">
                        <div class="row g-4">
                            <div class="col-sm-6">
                                <p class="mb-1 text-muted fw-semibold small text-uppercase letter-spacing-1">Department</p>
                                <p class="mb-0 fw-medium fs-5" th:text="${profile.department != null ? profile.department : 'Not specified'}"></p>
                            </div>
                            <div class="col-sm-6">
                                <p class="mb-1 text-muted fw-semibold small text-uppercase letter-spacing-1">Semester</p>
                                <p class="mb-0 fw-medium fs-5" th:text="${profile.semester != null ? profile.semester : 'Not specified'}"></p>
                            </div>
                            <div class="col-sm-6 mt-4">
                                <p class="mb-2 text-muted fw-semibold small text-uppercase letter-spacing-1">Availability</p>
                                <p class="mb-0 fw-medium"><span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle px-3 py-2 fs-6 rounded-pill" th:text="${profile.availabilityMode}"></span></p>
                            </div>
                            <div class="col-sm-6 mt-4">
                                <p class="mb-2 text-muted fw-semibold small text-uppercase letter-spacing-1">Preferred Time</p>
                                <p class="mb-0 fw-medium"><span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle px-3 py-2 fs-6 rounded-pill" th:text="${profile.preferredTime}"></span></p>
                            </div>
                            <div class="col-12 mt-4">
                                <p class="mb-2 text-muted fw-semibold small text-uppercase letter-spacing-1">Bio</p>
                                <p class="mb-0 text-dark lh-lg" th:text="${profile.bio != null ? profile.bio : 'No bio added yet.'}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <a th:href="@{/profile/edit}" class="btn btn-sb-primary px-5 py-3 rounded-pill shadow-sm fw-medium fs-5"><i class="bi bi-pencil-square me-2"></i>Edit Profile</a>
            </div>
        </div>
    </div>

    <div class="row mt-4 g-4 align-items-stretch">
        <div class="col-md-6 mb-4 mb-md-0 d-flex">
            <div class="sb-card w-100">
                <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 d-flex align-items-center"><i class="bi bi-tools text-primary me-2 fs-4"></i>My Skills</h5>
                    <a th:href="@{/profile/skills}" class="btn btn-light border btn-sm text-dark fw-medium rounded-pill px-3 transition-hover">Manage</a>
                </div>
                <div class="card-body p-4">
                    <div th:if="${#lists.isEmpty(skills)}" class="text-center py-5">
                        <div class="text-muted mb-3"><i class="bi bi-journal-x fs-1"></i></div>
                        <p class="text-muted mb-0 fs-5">You haven't added any skills yet.</p>
                    </div>
                    
                    <div th:unless="${#lists.isEmpty(skills)}" class="d-flex flex-wrap gap-2 mt-2">
                        <span th:each="skill : ${skills}" class="badge fs-6 rounded-pill px-3 py-2 border mb-2 me-1" 
                              th:classappend="${skill.skillType.name() == 'OFFERED' ? 'bg-success bg-opacity-10 text-success border-success-subtle' : 'bg-warning bg-opacity-10 text-warning-emphasis border-warning-subtle'}">
                            <span th:text="${skill.skillName}"></span>
                            <small class="ms-1 opacity-75" th:text="'(' + ${skill.skillType.name() == 'OFFERED' ? 'Teach' : 'Learn'} + ')'"></small>
                        </span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 d-flex">
            <div class="sb-card w-100">
                <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0 d-flex align-items-center"><i class="bi bi-star-fill text-warning me-2 fs-4"></i>Reputation</h5>
                    <a th:href="@{/profile/{username}/reviews(username=${profile.username})}" class="btn btn-light border btn-sm text-dark fw-medium rounded-pill px-3 transition-hover">View Reviews</a>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4 h-100">
                        <div class="col-6 h-100">
                            <div class="stat-box transition-hover">
                                <div class="stat-value text-warning d-flex align-items-center justify-content-center gap-2 mb-2">
                                    <span th:text="${#numbers.formatDecimal(profile.averageRating, 1, 1)}">0.0</span>
                                    <i class="bi bi-star-fill fs-4"></i>
                                </div>
                                <div class="stat-label">Avg Rating</div>
                            </div>
                        </div>
                        <div class="col-6 h-100">
                            <div class="stat-box transition-hover">
                                <div class="stat-value text-primary mb-2" th:text="${profile.reviewCount}">0</div>
                                <div class="stat-label">Total Reviews</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
