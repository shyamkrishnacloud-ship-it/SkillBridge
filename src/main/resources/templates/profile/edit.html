<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .edit-container { max-width: 800px; margin-top: 50px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background-color: #0d6efd; color: white; border-radius: 10px 10px 0 0 !important; padding: 20px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">SkillBridge</a>
        <div class="d-flex">
            <a th:href="@{/profile}" class="btn btn-outline-light me-2">Profile</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container edit-container mb-5">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">Edit Profile</h3>
        </div>
        <div class="card-body p-4">
            
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/profile/edit}" th:object="${profileDto}" method="post" enctype="multipart/form-data">
                
                <h5 class="mb-3 border-bottom pb-2">Account Details (Read-only)</h5>
                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control bg-light" th:field="*{username}" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control bg-light" th:field="*{email}" readonly>
                    </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Academic & Personal Info</h5>
                <div class="row mb-3">
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" th:field="*{department}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="semester" class="form-label">Semester</label>
                        <input type="number" min="1" max="10" class="form-control" id="semester" th:field="*{semester}">
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('semester')}" th:errors="*{semester}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="bio" class="form-label">Bio</label>
                    <textarea class="form-control" id="bio" rows="4" th:field="*{bio}" placeholder="Tell us a bit about yourself..."></textarea>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Preferences</h5>
                <div class="row mb-4">
                    <div class="col-md-6 mb-3">
                        <label for="availabilityMode" class="form-label">Availability Mode</label>
                        <select class="form-select" id="availabilityMode" th:field="*{availabilityMode}">
                            <option value="ONLINE">Online</option>
                            <option value="OFFLINE">Offline</option>
                            <option value="BOTH">Both</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="preferredTime" class="form-label">Preferred Time</label>
                        <select class="form-select" id="preferredTime" th:field="*{preferredTime}">
                            <option value="WEEKDAY">Weekday</option>
                            <option value="WEEKEND">Weekend</option>
                            <option value="ANYTIME">Anytime</option>
                        </select>
                    </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Profile Picture</h5>
                <div class="mb-4">
                    <div class="d-flex align-items-center mb-2">
                        <img th:if="${profileDto.existingProfilePicturePath != null}" th:src="@{${profileDto.existingProfilePicturePath}}" alt="Current Avatar" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%; margin-right: 15px;">
                        <div>
                            <label for="profilePicture" class="form-label mb-0">Upload New Picture</label>
                            <input class="form-control" type="file" id="profilePicture" name="profilePicture" accept="image/png, image/jpeg">
                            <small class="text-muted">Leave blank to keep existing picture.</small>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
