<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.username} + ' - Profile'">Public Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .profile-container { max-width: 850px; margin-top: 30px; }
        .hero-banner {
            height: 140px;
            background: linear-gradient(135deg, var(--sb-primary), #3B82F6);
            border-radius: 12px 12px 0 0;
            position: relative;
        }
        .profile-img { 
            width: 140px; 
            height: 140px; 
            object-fit: cover; 
            border-radius: 50%; 
            border: 5px solid var(--sb-surface); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            margin-top: -70px; 
            background-color: white; 
            position: relative;
            z-index: 10;
        }
        .stat-box {
            background-color: var(--sb-bg);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid var(--sb-border);
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--sb-text);
        }
        .stat-label {
            font-size: 0.85rem;
            color: var(--sb-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .review-card {
            margin-bottom: 1.5rem;
        }
        .skill-card {
            min-height: 180px;
            display: flex;
            flex-direction: column;
        }
        .skill-card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container profile-container mb-5">
    <div class="sb-card mt-4 mb-4">
        <div class="hero-banner"></div>
        <div class="card-body text-center pt-0 px-4 pb-5">
            <img th:if="${profile.existingProfilePicturePath != null}" th:src="@{${profile.existingProfilePicturePath}}" alt="Profile Picture" class="profile-img mb-3">
            <img th:unless="${profile.existingProfilePicturePath != null}" src="https://ui-avatars.com/api/?name=User&background=random" alt="Default Avatar" class="profile-img mb-3">
            
            <h3 class="fw-bold mb-1" th:text="${profile.username}">Username</h3>
            <div class="mb-4 d-flex justify-content-center">
                <span class="badge bg-warning bg-opacity-10 text-dark border border-warning-subtle fs-6 rounded-pill px-3 py-2 d-flex align-items-center gap-2 shadow-sm">
                    <i class="bi bi-star-fill text-warning"></i> <span class="fw-bold" th:text="${#numbers.formatDecimal(profile.averageRating, 1, 1)}">0.0</span> Rating
                </span>
            </div>
            
            <div class="row text-start justify-content-center mb-4">
                <div class="col-md-10">
                    <div class="sb-card bg-light border-0 p-4 p-md-5">
                        <div class="row g-4">
                            <div class="col-sm-6">
                                <p class="mb-1 text-muted fw-semibold small text-uppercase letter-spacing-1">Department</p>
                                <p class="mb-0 fw-medium fs-5" th:text="${profile.department != null ? profile.department : 'Not specified'}"></p>
                            </div>
                            <div class="col-sm-6">
                                <p class="mb-1 text-muted fw-semibold small text-uppercase letter-spacing-1">Semester</p>
                                <p class="mb-0 fw-medium fs-5" th:text="${profile.semester != null ? profile.semester : 'Not specified'}"></p>
                            </div>
                            <div class="col-12 mt-4">
                                <p class="mb-2 text-muted fw-semibold small text-uppercase letter-spacing-1">Bio</p>
                                <p class="mb-0 text-dark lh-lg" th:text="${profile.bio != null ? profile.bio : 'No bio added yet.'}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-5" th:unless="${isSelf}">
                <div th:if="${hasActiveRequest}">
                    <a th:href="@{/requests/incoming}" class="btn btn-secondary px-5 py-3 rounded-pill shadow-sm fw-medium fs-5"><i class="bi bi-box-arrow-in-down me-2"></i>View Existing Request</a>
                </div>
                <div th:unless="${hasActiveRequest}">
                    <a th:href="@{/requests/send/{username}(username=${profile.username})}" class="btn btn-sb-accent px-5 py-3 rounded-pill shadow-sm fw-medium fs-5"><i class="bi bi-send-fill me-2"></i>Send Swap Request</a>
                </div>
            </div>
        </div>
    </div>

    <div class="sb-card mb-4">
        <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 px-md-5 d-flex align-items-center gap-2">
            <i class="bi bi-tools text-primary fs-4"></i>
            <h5 class="fw-bold mb-0" th:text="|${profile.username}'s Skills|">Skills</h5>
        </div>
        <div class="card-body p-4 p-md-5">
            <div th:if="${skills == null or #lists.isEmpty(skills)}" class="text-center py-5 border rounded-4 bg-light">
                <div class="text-muted mb-3"><i class="bi bi-journal-x fs-1"></i></div>
                <p class="text-muted mb-0 fs-5">This user hasn't added any skills yet.</p>
            </div>
            
            <div th:unless="${skills == null or #lists.isEmpty(skills)}" class="row row-cols-1 row-cols-md-2 g-4">
                <div class="col" th:each="skill : ${skills}">
                    <div class="sb-card skill-card border transition-hover">
                        <div class="card-body skill-card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-4 gap-2">
                                <h5 class="card-title text-dark fw-bold mb-0 lh-base" th:text="${skill.skillName}">Skill Name</h5>
                                <span class="badge rounded-pill px-3 py-1 fw-medium flex-shrink-0" th:classappend="${skill.skillType.name() == 'OFFERED' ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : 'bg-warning bg-opacity-10 text-warning-emphasis border border-warning-subtle'}" th:text="${skill.skillType.name() == 'OFFERED' ? 'Teach' : 'Learn'}">Type</span>
                            </div>
                            <div class="mb-4 d-flex align-items-center gap-2 flex-wrap">
                                <span class="badge bg-light text-dark border px-2 py-1"><i class="bi bi-tag-fill text-muted me-1"></i><span th:text="${skill.skillCategory}">Category</span></span>
                                <span class="badge bg-light text-dark border px-2 py-1"><i class="bi bi-bar-chart-fill text-muted me-1"></i><span th:text="${skill.skillLevel}">Level</span></span>
                            </div>
                            <p class="card-text text-secondary mb-0 mt-auto lh-lg" style="font-size: 0.95rem;" th:if="${skill.description}" th:text="${skill.description}">Description</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Reviews Section -->
    <div class="sb-card mb-5">
        <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 px-md-5 d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-star-fill text-warning fs-4"></i>
                <h5 class="fw-bold mb-0" th:text="|${profile.username}'s Reviews|">Reviews</h5>
            </div>
            <a th:href="@{/profile/{username}/reviews(username=${profile.username})}" class="btn btn-light border rounded-pill shadow-sm fw-medium px-4 text-dark transition-hover" th:if="${profile.reviewCount > 0}">View All Reviews</a>
        </div>
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center justify-content-center justify-content-md-start mb-5" th:if="${profile.reviewCount > 0}">
                <div class="display-4 fw-bold text-dark me-3">
                    <span th:text="${#numbers.formatDecimal(profile.averageRating, 1, 1)}">0.0</span>
                </div>
                <div>
                    <div class="d-flex align-items-center mb-1 bg-warning bg-opacity-10 border border-warning-subtle rounded-pill px-3 py-1">
                        <i class="bi" th:each="i : ${#numbers.sequence(1, 5)}" th:classappend="${i <= profile.averageRating ? 'bi-star-fill text-warning me-1' : 'bi-star text-warning opacity-25 me-1'}" style="font-size: 1.25rem;"></i>
                    </div>
                    <small class="text-muted fw-medium d-block text-center mt-2" th:text="|Based on ${profile.reviewCount} completed swaps|">0 reviews</small>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(recentReviews)}" class="text-center py-5 border rounded-4 bg-light">
                <div class="text-muted mb-3"><i class="bi bi-chat-left-text fs-1"></i></div>
                <p class="text-muted mb-0 fs-5">This user hasn't received any reviews yet.</p>
            </div>

            <div th:unless="${#lists.isEmpty(recentReviews)}">
                <div class="row g-4">
                    <div class="col-12" th:each="review : ${recentReviews}">
                        <div class="sb-card review-card border mb-0 transition-hover">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center text-primary fw-bold fs-5 border shadow-sm" style="width: 45px; height: 45px;">
                                            <span th:text="${#strings.substring(review.reviewerUsername,0,1).toUpperCase()}">R</span>
                                        </div>
                                        <div>
                                            <h6 class="mb-0 fw-bold fs-5">
                                                <a th:href="@{/profile/{username}(username=${review.reviewerUsername})}" class="text-decoration-none text-dark stretched-link-hover" th:text="${review.reviewerUsername}">User</a>
                                            </h6>
                                            <small class="text-muted fw-medium d-flex align-items-center mt-1"><i class="bi bi-calendar3 me-1"></i><span th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}">Date</span></small>
                                        </div>
                                    </div>
                                    <div class="d-flex bg-warning bg-opacity-10 border border-warning-subtle rounded-pill px-3 py-1 shadow-sm">
                                        <i class="bi" style="font-size: 0.95rem;" th:each="i : ${#numbers.sequence(1, 5)}" th:classappend="${i <= review.rating ? 'bi-star-fill text-warning me-1' : 'bi-star text-warning opacity-25 me-1'}"></i>
                                    </div>
                                </div>
                                <p class="mb-0 text-dark fs-6 lh-lg mt-3" th:if="${review.comment != null and !review.comment.isEmpty()}" th:text="${review.comment}"></p>
                                <p class="mb-0 text-muted fst-italic mt-3" th:unless="${review.comment != null and !review.comment.isEmpty()}">No comment provided.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
