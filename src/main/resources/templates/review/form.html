<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 600px; margin-top: 50px; margin-bottom: 50px; }
        .card { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background-color: #0d6efd; color: white; border-radius: 10px 10px 0 0 !important; padding: 20px; }
        .star-rating { font-size: 1.5rem; color: #ffc107; cursor: pointer; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container form-container">
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    
    <div class="card">
        <div class="card-header text-center">
            <h3 class="mb-0">Leave a Review</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/reviews/new/{id}(id=${reviewDto.swapRequestId})}" th:object="${reviewDto}" method="post">
                
                <!-- Hidden field to preserve the swapRequestId across POST round-trips -->
                <input type="hidden" th:field="*{swapRequestId}">
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Rating (1 to 5 Stars)</label>
                    <select class="form-select" th:field="*{rating}" required>
                        <option value="" selected disabled>-- Select a rating --</option>
                        <option value="5">★★★★★ (5 - Excellent)</option>
                        <option value="4">★★★★☆ (4 - Good)</option>
                        <option value="3">★★★☆☆ (3 - Average)</option>
                        <option value="2">★★☆☆☆ (2 - Poor)</option>
                        <option value="1">★☆☆☆☆ (1 - Terrible)</option>
                    </select>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>

                <div class="mb-4">
                    <label for="comment" class="form-label fw-bold">Comment (Optional)</label>
                    <textarea class="form-control" id="comment" rows="4" th:field="*{comment}" placeholder="How was your experience learning/teaching with this student?"></textarea>
                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                    <small class="text-muted">Maximum 500 characters</small>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Submit Review</button>
                    <a th:href="@{/requests/incoming}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
