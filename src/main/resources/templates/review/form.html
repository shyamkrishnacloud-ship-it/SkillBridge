<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .form-container { max-width: 600px; margin-top: 40px; margin-bottom: 50px; }
        .form-label {
            font-weight: 500;
            color: var(--sb-text-muted);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--sb-border);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--sb-primary);
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
        }
        .rating-select-wrapper {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), rgba(245, 158, 11, 0.02));
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 24px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container form-container">
    <div th:if="${errorMessage}" class="alert alert-danger border-0 shadow-sm rounded-3 mb-4 d-flex align-items-center gap-2" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>
    
    <div class="sb-card border-top border-4 border-warning border-start-0 border-end-0 border-bottom-0">
        <div class="card-header bg-white border-bottom pt-4 pb-3 text-center">
            <div class="d-inline-flex justify-content-center align-items-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 60px; height: 60px;">
                <i class="bi bi-star-fill fs-2"></i>
            </div>
            <h4 class="mb-1 fw-bold text-dark">Leave a Review</h4>
            <p class="text-muted mb-0">Share your experience with your skill exchange partner</p>
        </div>
        <div class="card-body p-4 p-md-5">
            <form th:action="@{/reviews/new/{id}(id=${reviewDto.swapRequestId})}" th:object="${reviewDto}" method="post">
                
                <!-- Hidden field to preserve the swapRequestId across POST round-trips -->
                <input type="hidden" th:field="*{swapRequestId}">
                
                <div class="mb-4 rating-select-wrapper text-center">
                    <label class="form-label fw-bold text-dark mb-3 d-block">How would you rate this experience?</label>
                    <select class="form-select text-center fw-medium text-warning-emphasis bg-white mx-auto" style="max-width: 300px;" th:field="*{rating}" required>
                        <option value="" selected disabled>-- Select a rating --</option>
                        <option value="5">★★★★★ (5 - Excellent)</option>
                        <option value="4">★★★★☆ (4 - Good)</option>
                        <option value="3">★★★☆☆ (3 - Average)</option>
                        <option value="2">★★☆☆☆ (2 - Poor)</option>
                        <option value="1">★☆☆☆☆ (1 - Terrible)</option>
                    </select>
                    <div class="text-danger mt-2 small" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                </div>

                <div class="mb-5">
                    <label for="comment" class="form-label d-flex justify-content-between">
                        <span><i class="bi bi-chat-text me-1"></i> Review Comment <span class="fw-normal text-muted small">(Optional)</span></span>
                    </label>
                    <textarea class="form-control" id="comment" rows="4" th:field="*{comment}" placeholder="How was your experience learning/teaching with this student? What did you like?"></textarea>
                    <div class="d-flex justify-content-between mt-1">
                        <div class="text-danger small" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                        <small class="text-muted ms-auto">Max 500 characters</small>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row gap-3 pt-3 border-top">
                    <a th:href="@{/requests/incoming}" class="btn btn-light border py-3 px-4 fw-medium text-dark rounded-pill flex-grow-1 text-center transition-hover">Cancel</a>
                    <button type="submit" class="btn btn-sb-primary py-3 px-4 fw-bold rounded-pill shadow-sm flex-grow-1">
                        <i class="bi bi-send-check-fill me-2"></i> Submit Review
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
