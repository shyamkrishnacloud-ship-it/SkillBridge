<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${revieweeUsername} + ' Reviews — SkillBridge'">Reviews</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .rating-hero {
            background: linear-gradient(135deg, rgba(37,99,235,0.04), rgba(16,185,129,0.04));
            border: 1px solid var(--sb-border);
            border-radius: var(--sb-radius-lg);
            padding: 2.5rem;
            text-align: center;
        }
        .rating-big {
            font-size: 4rem; font-weight: 900;
            letter-spacing: -0.05em; line-height: 1;
            color: var(--sb-text); margin-bottom: 0.5rem;
        }
        .stars-row { display: inline-flex; gap: 0.25rem; font-size: 1.25rem; margin-bottom: 0.75rem; }
        .star-filled { color: #F59E0B; }
        .star-empty  { color: #E2E8F0; }
        .review-card {
            background: #fff;
            border: 1px solid var(--sb-border);
            border-radius: var(--sb-radius-lg);
            padding: 1.5rem;
            height: 100%;
            transition: all 0.2s ease;
        }
        .review-card:hover { border-color: var(--sb-border-hover); box-shadow: var(--sb-shadow); }
        .review-stars { display: inline-flex; gap: 3px; font-size: 0.9rem; }
        .reviewer-avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sb-primary-light), rgba(16,185,129,0.1));
            border: 2px solid var(--sb-border);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; color: var(--sb-primary);
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container sb-page" style="max-width: 900px;">

    <!-- Back + Header -->
    <div class="d-flex align-items-center justify-content-between mb-5">
        <div>
            <a th:href="@{/profile/{u}(u=${revieweeUsername})}" class="back-link d-inline-flex align-items-center gap-1 mb-2"
               style="font-size:0.8125rem;color:var(--sb-text-muted);text-decoration:none;">
                <i class="bi bi-arrow-left"></i> Back to profile
            </a>
            <h1 class="sb-page-title">
                <span th:text="${revieweeUsername}">User</span>'s Reviews
            </h1>
        </div>
    </div>

    <!-- Rating Hero -->
    <div class="rating-hero mb-5">
        <div class="rating-big" th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</div>
        <div class="stars-row">
            <i class="bi" th:each="i : ${#numbers.sequence(1, 5)}"
               th:classappend="${i <= averageRating ? 'bi-star-fill star-filled' : 'bi-star star-empty'}"></i>
        </div>
        <div style="font-size:0.9375rem;color:var(--sb-text-muted);">
            Based on
            <strong style="color:var(--sb-text);" th:text="${reviewCount}">0</strong>
            completed swap<span th:if="${reviewCount != 1}">s</span>
        </div>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(reviews)}" class="sb-card sb-empty">
        <div class="sb-empty-icon"><i class="bi bi-chat-square-text"></i></div>
        <h4>No reviews yet</h4>
        <p>This student hasn't received any reviews from completed skill swaps.</p>
    </div>

    <!-- Review Cards -->
    <div class="row g-4" th:unless="${#lists.isEmpty(reviews)}">
        <div class="col-md-6" th:each="review : ${reviews}">
            <div class="review-card">
                <!-- Reviewer row -->
                <div class="d-flex align-items-center gap-3 mb-3 pb-3" style="border-bottom:1px solid var(--sb-border);">
                    <div class="reviewer-avatar">
                        <span th:text="${#strings.substring(review.reviewerUsername,0,1).toUpperCase()}">R</span>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <a th:href="@{/profile/{u}(u=${review.reviewerUsername})}"
                           style="font-size:0.9375rem;font-weight:700;color:var(--sb-text);text-decoration:none;display:block;"
                           th:text="${review.reviewerUsername}">Reviewer</a>
                        <div style="font-size:0.75rem;color:var(--sb-text-muted);">
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}">Date</span>
                        </div>
                    </div>
                    <!-- Star rating pill -->
                    <div style="background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.2);border-radius:9999px;padding:0.25rem 0.75rem;display:inline-flex;align-items:center;gap:3px;">
                        <i class="bi" th:each="i : ${#numbers.sequence(1, 5)}"
                           style="font-size:0.8rem;"
                           th:classappend="${i <= review.rating ? 'bi-star-fill star-filled' : 'bi-star star-empty'}"></i>
                    </div>
                </div>
                <!-- Comment -->
                <p th:if="${review.comment != null and !review.comment.isEmpty()}"
                   style="font-size:0.9375rem;color:var(--sb-text);line-height:1.65;margin:0;"
                   th:text="${review.comment}"></p>
                <p th:unless="${review.comment != null and !review.comment.isEmpty()}"
                   style="font-size:0.9rem;color:var(--sb-text-muted);font-style:italic;margin:0;">No comment provided.</p>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: active-nav-script}"></script>
</body>
</html>
