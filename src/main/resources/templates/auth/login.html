<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .login-container {
            max-width: 420px;
            margin-top: 8vh;
        }
        .auth-header {
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px 12px 0 0;
            background: linear-gradient(135deg, var(--sb-primary), #3B82F6);
            color: white;
        }
        .auth-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container login-container mb-5">
    
    <!-- Success Message from Registration -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <!-- Login Error Message -->
    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    
    <!-- Logout Message -->
    <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show border-0 shadow-sm rounded-3 mb-4" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>You have been logged out successfully.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="sb-card overflow-hidden">
        <div class="auth-header">
            <i class="bi bi-person-circle auth-icon"></i>
            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="mb-0 text-white-50">Sign in to SkillBridge</p>
        </div>
        <div class="card-body p-4 p-md-5 bg-white">
            <form th:action="@{/login}" method="post">
                <div class="mb-4">
                    <label for="username" class="form-label fw-medium text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control bg-light border-start-0 ps-0" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-medium text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-sb-primary w-100 py-2 fs-5 mt-2">Sign In</button>
            </form>
            
            <div class="mt-4 text-center">
                <p class="text-muted mb-2">Don't have an account? <a th:href="@{/register}" class="text-decoration-none fw-semibold">Sign up here</a></p>
                <a th:href="@{/}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
