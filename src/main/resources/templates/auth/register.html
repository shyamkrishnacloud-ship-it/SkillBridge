<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SkillBridge</title>
    <meta name="description" content="Join SkillBridge — the student skill exchange platform. Create your free account today.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        body { background: var(--sb-bg); min-height: 100vh; display: flex; flex-direction: column; }
        .auth-layout {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }
        .auth-panel {
            background: #fff;
            border: 1px solid var(--sb-border);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .auth-header { padding: 2.5rem 2.5rem 0; }
        .auth-body { padding: 2rem 2.5rem 2.5rem; }
        .auth-logo {
            display: flex; align-items: center; gap: 0.5rem;
            font-weight: 800; font-size: 1.125rem; color: var(--sb-primary);
            text-decoration: none; margin-bottom: 2rem;
        }
        .auth-logo .logo-icon {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #2563EB, #3B82F6);
            border-radius: 7px; display: flex; align-items: center;
            justify-content: center; color: #fff; font-size: 0.9rem;
        }
        .auth-title { font-size: 1.625rem; font-weight: 800; letter-spacing: -0.03em; color: var(--sb-text); margin-bottom: 0.375rem; }
        .auth-sub { font-size: 0.9375rem; color: var(--sb-text-muted); margin-bottom: 0; }
        .form-field { margin-bottom: 1.125rem; }
        .form-field label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--sb-text); margin-bottom: 0.375rem; }
        .input-wrap { position: relative; }
        .input-wrap .input-icon {
            position: absolute; left: 0.875rem; top: 50%;
            transform: translateY(-50%); color: var(--sb-text-muted);
            font-size: 1rem; z-index: 1; pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            padding: 0.6875rem 0.875rem 0.6875rem 2.5rem;
            border: 1px solid var(--sb-border); border-radius: 9px;
            font-size: 0.9375rem; color: var(--sb-text); background: var(--sb-surface);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            font-family: 'Inter', sans-serif;
        }
        .input-wrap input:focus { outline: none; border-color: var(--sb-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
        .input-wrap input::placeholder { color: var(--sb-text-light); }
        .input-wrap input.is-invalid { border-color: #DC2626; }
        .field-error { font-size: 0.8rem; color: #DC2626; margin-top: 0.25rem; display: flex; align-items: center; gap: 0.25rem; }
        .btn-auth {
            width: 100%; padding: 0.75rem; border: none; border-radius: 9px;
            font-size: 1rem; font-weight: 700; color: #fff; background: var(--sb-primary);
            cursor: pointer; transition: all 0.15s ease;
            box-shadow: 0 2px 6px rgba(37,99,235,0.25);
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-auth:hover { background: var(--sb-primary-hover); box-shadow: 0 4px 14px rgba(37,99,235,0.35); transform: translateY(-1px); }
        .auth-footer-links {
            text-align: center; padding-top: 1.5rem;
            border-top: 1px solid var(--sb-border); margin-top: 1.5rem;
        }
        .auth-footer-links p { font-size: 0.875rem; color: var(--sb-text-muted); margin: 0 0 0.75rem; }
        .auth-footer-links a { color: var(--sb-primary); font-weight: 600; text-decoration: none; }
        .auth-footer-links a:hover { text-decoration: underline; }
        .back-link { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.8125rem; color: var(--sb-text-muted); text-decoration: none; }
        .back-link:hover { color: var(--sb-text); }
    </style>
</head>
<body>
<div class="auth-layout">
    <div class="auth-panel">
        <div class="auth-header">
            <a th:href="@{/}" class="auth-logo">
                <span class="logo-icon"><i class="bi bi-layers-half"></i></span>
                SkillBridge
            </a>
            <h1 class="auth-title">Create your account</h1>
            <p class="auth-sub">Join the SkillBridge community — it's free</p>
        </div>
        <div class="auth-body">
            <form th:action="@{/register}" th:object="${registerDto}" method="post" novalidate>

                <div class="form-field">
                    <label for="username">Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="username"
                               th:field="*{username}"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                               placeholder="Choose a unique username" required autofocus>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{username}"></span>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email"
                               th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="name@college.edu.in" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password"
                               th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                               placeholder="Create a strong password" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{password}"></span>
                    </div>
                </div>

                <div class="form-field" style="margin-bottom: 1.75rem;">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-shield-lock input-icon"></i>
                        <input type="password" id="confirmPassword"
                               th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                               placeholder="Repeat your password" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:errors="*{confirmPassword}"></span>
                    </div>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="bi bi-person-plus-fill"></i> Create Account
                </button>
            </form>

            <div class="auth-footer-links">
                <p>Already have an account? <a th:href="@{/login}">Sign in instead</a></p>
                <a th:href="@{/}" class="back-link">
                    <i class="bi bi-arrow-left"></i> Back to homepage
                </a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
