<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .unread-indicator { width: 10px; height: 10px; background-color: var(--sb-primary); border-radius: 50%; display: inline-block; }
        .notification-card {
            border-left: 4px solid transparent !important;
        }
        .notification-card.unread {
            border-left-color: var(--sb-primary) !important;
            background-color: rgba(37, 99, 235, 0.03);
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mt-md-5 mb-5" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h3 class="fw-bold mb-0 text-dark">
            <i class="bi bi-bell-fill text-primary me-2"></i>Notifications
        </h3>
        <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-sm btn-light border fw-medium rounded-pill shadow-sm transition-hover text-dark"><i class="bi bi-check2-all me-1"></i> Mark all read</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="sb-card text-center py-5 border-0">
        <div class="card-body py-4">
            <div class="text-muted mb-3"><i class="bi bi-bell-slash" style="font-size: 3rem;"></i></div>
            <h5 class="fw-bold mb-2">No notifications</h5>
            <p class="text-muted mb-0">You're all caught up! Check back later.</p>
        </div>
    </div>

    <div class="row row-cols-1 g-3">
        <div class="col" th:each="notif : ${notifications}">
            <div class="sb-card notification-card transition-hover border" th:classappend="${!notif.read ? 'unread border-primary border-opacity-25' : 'border-light-subtle'}">
                <div class="card-body p-3 p-md-4 d-flex justify-content-between align-items-center gap-3">
                    <div class="d-flex align-items-start gap-3 flex-grow-1">
                        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" 
                             style="width: 40px; height: 40px;"
                             th:classappend="${
                                 notif.type.name() == 'REQUEST_RECEIVED' ? 'bg-info bg-opacity-10 text-info' : 
                                 (notif.type.name() == 'REQUEST_ACCEPTED' ? 'bg-success bg-opacity-10 text-success' : 
                                 (notif.type.name() == 'REQUEST_REJECTED' ? 'bg-danger bg-opacity-10 text-danger' : 
                                 (notif.type.name() == 'REQUEST_COMPLETED' ? 'bg-primary bg-opacity-10 text-primary' : 'bg-warning bg-opacity-10 text-warning')))}">
                             <i class="bi" th:classappend="${
                                 notif.type.name() == 'REQUEST_RECEIVED' ? 'bi-box-arrow-in-down' : 
                                 (notif.type.name() == 'REQUEST_ACCEPTED' ? 'bi-check-circle-fill' : 
                                 (notif.type.name() == 'REQUEST_REJECTED' ? 'bi-x-circle-fill' : 
                                 (notif.type.name() == 'REQUEST_COMPLETED' ? 'bi-trophy-fill' : 'bi-star-fill')))}"></i>
                        </div>
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span th:if="${!notif.read}" class="unread-indicator"></span>
                                <small class="text-muted fw-semibold" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy • HH:mm')}">Date</small>
                                <span class="badge fw-normal rounded-pill" style="font-size: 0.7rem;"
                                      th:text="${#strings.replace(notif.type.name(), '_', ' ')}"
                                      th:classappend="${
                                          notif.type.name() == 'REQUEST_RECEIVED' ? 'bg-info bg-opacity-10 text-info border border-info-subtle' : 
                                          (notif.type.name() == 'REQUEST_ACCEPTED' ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : 
                                          (notif.type.name() == 'REQUEST_REJECTED' ? 'bg-danger bg-opacity-10 text-danger border border-danger-subtle' : 
                                          (notif.type.name() == 'REQUEST_COMPLETED' ? 'bg-primary bg-opacity-10 text-primary border border-primary-subtle' : 'bg-warning bg-opacity-10 text-warning border border-warning-subtle')))}">Type</span>
                            </div>
                            <h6 class="card-title mb-0 fw-medium text-dark" th:text="${notif.message}">Notification Message</h6>
                        </div>
                    </div>
                    
                    <form th:if="${!notif.read}" th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-light border text-primary rounded-circle" style="width: 35px; height: 35px; padding: 0;" title="Mark as read">
                            <i class="bi bi-check-lg"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
