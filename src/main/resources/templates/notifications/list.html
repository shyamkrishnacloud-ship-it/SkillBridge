<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style th:replace="~{fragments/navbar :: global-styles}"></style>
    <style>
        .notif-card {
            background: #fff;
            border: 1px solid var(--sb-border);
            border-radius: var(--sb-radius-lg);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .notif-card.unread {
            border-color: rgba(37,99,235,0.2);
            background: rgba(37,99,235,0.02);
        }
        .notif-card.unread::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--sb-primary);
            border-radius: 2px 0 0 2px;
        }
        .notif-card:hover { border-color: var(--sb-border-hover); box-shadow: var(--sb-shadow); }
        .notif-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.125rem; flex-shrink: 0;
        }
        .notif-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--sb-primary); flex-shrink: 0;
        }
        .notif-time { font-size: 0.75rem; color: var(--sb-text-muted); white-space: nowrap; }
        .notif-type-badge {
            display: inline-flex; align-items: center; gap: 0.25rem;
            padding: 0.125rem 0.5rem; border-radius: 9999px;
            font-size: 0.7rem; font-weight: 600; border: 1px solid;
            margin-bottom: 0.25rem;
        }
        .notif-msg { font-size: 0.9rem; font-weight: 500; color: var(--sb-text); line-height: 1.4; }
        .mark-read-btn {
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid var(--sb-border);
            background: #fff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--sb-primary); font-size: 0.9rem;
            transition: all 0.15s ease; flex-shrink: 0;
        }
        .mark-read-btn:hover { background: var(--sb-primary); color: #fff; border-color: var(--sb-primary); }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container sb-page" style="max-width: 780px;">

    <!-- Page Header -->
    <div class="d-flex align-items-center justify-content-between mb-5">
        <div class="sb-section-header mb-0" style="margin-bottom:0!important;">
            <div class="sb-section-icon" style="background:rgba(37,99,235,0.08);color:#2563EB;">
                <i class="bi bi-bell-fill"></i>
            </div>
            <div>
                <h1 class="sb-page-title">Notifications</h1>
                <p class="sb-page-subtitle">Stay updated with your latest activity.</p>
            </div>
        </div>
        <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn-sb-outline" style="font-size:0.875rem;">
                <i class="bi bi-check2-all"></i> Mark all read
            </button>
        </form>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(notifications)}" class="sb-card sb-empty">
        <div class="sb-empty-icon"><i class="bi bi-bell-slash"></i></div>
        <h4>All caught up!</h4>
        <p>You have no notifications right now. We'll let you know when something happens.</p>
        <a th:href="@{/matches}" class="btn-sb-primary"><i class="bi bi-people-fill"></i> Find Skill Partners</a>
    </div>

    <!-- Notification List -->
    <div class="d-flex flex-column gap-2" th:if="${not #lists.isEmpty(notifications)}">
        <div th:each="notif : ${notifications}"
             class="notif-card"
             th:classappend="${!notif.read ? ' unread' : ''}">

            <!-- Icon -->
            <div class="notif-icon"
                 th:classappend="${
                    notif.type.name() == 'REQUEST_RECEIVED'  ? 'bg-info bg-opacity-10 text-info' :
                   (notif.type.name() == 'REQUEST_ACCEPTED'  ? 'bg-success bg-opacity-10 text-success' :
                   (notif.type.name() == 'REQUEST_REJECTED'  ? 'bg-danger bg-opacity-10 text-danger' :
                   (notif.type.name() == 'REQUEST_COMPLETED' ? 'bg-primary bg-opacity-10 text-primary' : 'bg-warning bg-opacity-10 text-warning')))}">
                <i class="bi" th:classappend="${
                    notif.type.name() == 'REQUEST_RECEIVED'  ? 'bi-box-arrow-in-down' :
                   (notif.type.name() == 'REQUEST_ACCEPTED'  ? 'bi-check-circle-fill' :
                   (notif.type.name() == 'REQUEST_REJECTED'  ? 'bi-x-circle-fill' :
                   (notif.type.name() == 'REQUEST_COMPLETED' ? 'bi-trophy-fill' : 'bi-star-fill')))}"></i>
            </div>

            <!-- Content -->
            <div style="flex:1;min-width:0;">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <div th:if="${!notif.read}" class="notif-dot"></div>
                    <span class="notif-type-badge"
                          th:classappend="${
                            notif.type.name() == 'REQUEST_RECEIVED'  ? 'bg-info bg-opacity-10 text-info border-0' :
                           (notif.type.name() == 'REQUEST_ACCEPTED'  ? 'bg-success bg-opacity-10 text-success border-0' :
                           (notif.type.name() == 'REQUEST_REJECTED'  ? 'bg-danger bg-opacity-10 text-danger border-0' :
                           (notif.type.name() == 'REQUEST_COMPLETED' ? 'bg-primary bg-opacity-10 text-primary border-0' : 'bg-warning bg-opacity-10 text-warning border-0')))}"
                          th:text="${#strings.replace(notif.type.name(), '_', ' ')}">TYPE</span>
                    <span class="notif-time ms-auto"
                          th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy • HH:mm')}">Date</span>
                </div>
                <div class="notif-msg" th:text="${notif.message}">Notification message</div>
            </div>

            <!-- Mark read button -->
            <form th:if="${!notif.read}" th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post">
                <button type="submit" class="mark-read-btn" title="Mark as read">
                    <i class="bi bi-check-lg"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{fragments/navbar :: active-nav-script}"></script>
</body>
</html>
