<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - SkillBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .unread-indicator { width: 10px; height: 10px; background-color: #0d6efd; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Notifications</h2>
        <form th:if="${unreadNotificationCount > 0}" th:action="@{/notifications/read-all}" method="post">
            <button type="submit" class="btn btn-primary">Mark all as read</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}" class="alert alert-info">
        You don't have any notifications yet.
    </div>

    <div class="row row-cols-1 g-3">
        <div class="col" th:each="notif : ${notifications}">
            <div class="card" th:classappend="${!notif.read ? 'border-primary' : 'border-light'}">
                <div class="card-body d-flex justify-content-between align-items-center" th:classappend="${!notif.read ? 'bg-light' : ''}">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-1">
                            <span th:if="${!notif.read}" class="unread-indicator"></span>
                            <small class="text-muted" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}">Date</small>
                            <span class="badge bg-secondary" th:text="${notif.type}">Type</span>
                        </div>
                        <h5 class="card-title mb-0" th:text="${notif.message}">Notification Message</h5>
                    </div>
                    
                    <form th:if="${!notif.read}" th:action="@{/notifications/{id}/read(id=${notif.id})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-primary">Mark as read</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
